<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简历工作台</title><link rel="stylesheet" href="popup.css"><body><header><span class="logo">简</span><div><h1>简历工作台</h1><p>你的资料，你的填写助手</p></div></header><label for="resume">使用简历</label><select id="resume"></select><div class="actions"><button id="floating">显示页面悬浮助手</button><button id="scan">识别当前页面</button><button id="manage" class="secondary">管理资料与 API</button></div><p id="status" role="status">先识别页面，检查匹配结果后再填写。</p><section id="preview" hidden><div class="preview-title"><h2>匹配预览</h2><span id="count"></span></div><p class="hint">AI 匹配将向你配置的 API 发送字段标签与当前简历资料。勾选要填写的项目。</p><button id="ai" class="secondary">发送资料并用 AI 匹配</button><div id="rows"></div><label class="check"><input type="checkbox" id="overwrite">覆盖页面已有内容</label><button id="apply">填写选中项目</button></section><footer>不会自动提交申请 · 无法识别的字段留给你确认</footer><script type="module" src="popup.js"></script></body></html>
