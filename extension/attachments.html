<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>本地附件库 · 简历工作台</title>
  <link rel="stylesheet" href="attachments.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">LOCAL ATTACHMENTS</p>
      <h1>本地附件库</h1>
      <p>提前保存简历、成绩单和证书。选择文件控件后仍需在招聘页面复核，扩展不会提交申请。</p>
    </div>
    <a href="workbench.html">返回简历工作台</a>
  </header>

  <main>
    <section class="toolbar" aria-labelledby="profile-heading">
      <div>
        <h2 id="profile-heading">归属简历</h2>
        <p>附件按简历和用途分别保存，仅存在当前浏览器。</p>
      </div>
      <label>简历<select id="resume"></select></label>
    </section>

    <div class="columns">
      <section aria-labelledby="file-heading">
        <h2 id="file-heading">选择并保存文件</h2>
        <p>文件内容写入扩展本地数据库。这里选择的单个文件不超过 10 MB，附件库已知大小合计不超过 30 MB。</p>
        <form id="fileForm">
          <label>用途<select id="fileKind">
            <option value="resume">简历</option>
            <option value="transcript">成绩单</option>
            <option value="certificate">证书</option>
            <option value="other">其他</option>
          </select></label>
          <label>本地文件<input id="files" type="file" multiple required></label>
          <button type="submit">保存到附件库</button>
        </form>
      </section>

      <section aria-labelledby="path-heading">
        <h2 id="path-heading">记录绝对路径</h2>
        <p>适合固定文件。扩展不主动读取路径，无法提前核验文件是否存在或是否超过网站大小限制；填写时由 Chrome 直接交给已识别的文件控件。</p>
        <form id="pathForm">
          <label>用途<select id="pathKind">
            <option value="resume">简历</option>
            <option value="transcript">成绩单</option>
            <option value="certificate">证书</option>
            <option value="other">其他</option>
          </select></label>
          <label>绝对路径<input id="path" autocomplete="off" placeholder="/Users/name/Documents/resume.pdf" required></label>
          <label>显示名称（可选）<input id="pathName" maxlength="240" placeholder="默认取文件名"></label>
          <button type="submit">保存路径记录</button>
        </form>
      </section>
    </div>

    <section class="library" aria-labelledby="library-heading">
      <div class="library-title">
        <div><h2 id="library-heading">已保存附件</h2><p id="usage"></p></div>
        <select id="filter" aria-label="附件用途筛选">
          <option value="">全部用途</option>
          <option value="resume">简历</option>
          <option value="transcript">成绩单</option>
          <option value="certificate">证书</option>
          <option value="other">其他</option>
        </select>
      </div>
      <div id="list"></div>
    </section>
    <p id="status" role="status"></p>
  </main>
  <script type="module" src="attachments.js"></script>
</body>
</html>
