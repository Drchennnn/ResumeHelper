name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run vendor:pdfjs
      - run: npm run check
      - run: npm test
