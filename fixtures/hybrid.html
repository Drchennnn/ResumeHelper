<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>混合填写验收 · 本机测试</title><style>
body{font:16px system-ui;max-width:760px;margin:50px auto;color:#17314d;background:#f6f8fc}section{background:white;padding:28px;border:1px solid #ccd9e8;border-radius:12px;margin:20px 0}label{display:block;font-weight:650;margin:20px 0 8px}input,[role=combobox]{box-sizing:border-box;border:1px solid #acbcd1;border-radius:7px;padding:12px;font:inherit;width:100%;background:white}[role=combobox]{cursor:pointer}[role=listbox]{margin-top:6px;background:#eff5ff;padding:8px;border:1px solid #82a3cf}[role=option]{padding:10px;cursor:pointer}[role=option]:hover{background:#cddffe}svg{height:30px;width:100px}pre{white-space:pre-wrap;line-height:1.6;background:#e8f0fb;padding:15px}[hidden]{display:none!important}button{padding:10px 16px}
</style></head><body><h1>DOM → 浏览器输入 → 视觉兜底</h1><p>本机验收页，不提交、不保存。两个控件故意只接受浏览器可信事件。</p><section data-section="personal"><h2>个人信息</h2><label for="trusted-name">姓名</label><input id="trusted-name" aria-label="姓名" placeholder="普通 DOM 写入会被模拟组件拒绝"><label for="visual-gender">性别</label><div id="visual-gender" role="combobox" aria-label="性别" aria-controls="gender-menu" tabindex="0">请选择性别</div><div id="gender-menu" role="listbox" hidden><div role="option" aria-label="选项 A" data-value="a"><svg viewBox="0 0 100 30" aria-hidden="true"><text x="0" y="24" font-size="23">男</text></svg></div><div role="option" aria-label="选项 B" data-value="b"><svg viewBox="0 0 100 30" aria-hidden="true"><text x="0" y="24" font-size="23">女</text></svg></div></div></section><pre id="result" role="status">等待测试</pre><button type="submit" id="danger">提交（禁止点击）</button><script src="hybrid.js"></script></body></html>
